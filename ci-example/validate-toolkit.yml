# Optional example CI check for the toolkit manifest (PRD §6.6 TKT-3).
# Fails the pull request when any tool in config/toolkit.yaml has no Data and Analytics Branch box,
# names a box that isn't on the branch chart, breaks the schema, or the generated JS is stale.
name: validate-toolkit
on:
  pull_request:
    paths: ["config/toolkit.yaml", "scripts/*_toolkit.py", "js/toolkit-manifest.generated.js"]
  push:
    branches: [main]
    paths: ["config/toolkit.yaml", "scripts/*_toolkit.py", "js/toolkit-manifest.generated.js"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build_refs.py needs git history for file@sha
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Generated JS is up to date
        run: python3 scripts/build_toolkit.py --check
      - name: Branch-box traceability and schema (TKT-3)
        run: python3 scripts/validate_toolkit.py
      - name: Defined in file@sha refs (no folders, tags or made-up SHAs)
        run: python3 scripts/build_refs.py --check
      - name: IaC guide manifest is current and valid
        run: python3 scripts/build_iac_guide.py --check && python3 scripts/validate_iac_guide.py
      - name: Manifest regression tests (blueprint + IaC guide)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
