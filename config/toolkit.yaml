# Platform blueprint / Toolkit manifest (PRD §6.6 TKT-2, decision #10). SOURCE OF TRUTH.
#
# The blueprint page (pages/blueprint.html) is rendered from this file:
#   python3 scripts/build_toolkit.py      -> writes js/toolkit-manifest.generated.js (do not edit that file)
#   python3 scripts/validate_toolkit.py   -> CI check (TKT-3): every tool must trace to a Data and Analytics
#                                            Branch (DAB) chart box or band; exits non-zero otherwise
#
# Schema keys and type tags are vendor-neutral. Product names appear only as values (MAP-11 exception).
# Content: /workspace/mmah-fabric-toolkit-ideal-state.md (2026-10-07). Fabric = intended platform per Team lead
# 2026-10-07, not yet ministry-confirmed.
#
# DEMO DATA: statuses, per-environment breakdowns, IaC paths and commit hashes are mock sample values.
# Security bounds (TKT-11 / ACC-3): no network identifiers, key identifiers, IP ranges or secrets here.
#
# Tool entry fields:
#   id, tag (EXT ING STORE PROC SERVE ENR SVC GOV MON PLAT PORTAL), title, subtitle
#   exactly one of: column (+ row) | bar | container
#   branch_boxes      ids from `branch_boxes` below (DAB chart); at least one (TKT-3)
#   owning_unit       BIRU | SDGU-G | SDGU-E | DPU | CLUSTER?      owner: optional free-text owner line
#   phase             v1 | next | future
#   status            planned | prov | live                        status_source: which adapter sets it (TKT-7)
#   status_by_env     Dev / Test / Pre-Prod / Prod -> planned | prov | live | na
#   summary, why      what it is; why we use it
#   iac               repo file path (path/file.ext); build adds @<sha of last commit touching it> | na (process / external) | tbd (not yet defined)
#   docs              [{label, href}]   href null = not linked in the demo
#   upstream, downstream, home_node (home process-map node), links_deeper [{label, href}] (hrefs relative to pages/)

