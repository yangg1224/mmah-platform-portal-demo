- id: st-adls
  tag: STORE
  title: Azure Data Lake Storage Gen2
  subtitle: Storage account · hierarchical namespace
  parent: azure
  resource_kind: azure-resource
  resource_type: Microsoft.Storage/storageAccounts (ADLS Gen2)
  branch_boxes:
  - ingest
  - access
  - policy
  owning_unit: SDGU-E
  owner: 'Proposed: SDGU-E manages storage; DPU and SDGU-G set retention and access requirements.'
  phase: v1
  status: planned
  status_source: Proposed architecture; no deployment inventory or runtime evidence supplied.
  status_by_env:
    Dev: planned
    Test: planned
    Pre-Prod: planned
    Prod: planned
  summary: A storage account with hierarchical namespace enabled holds the original landed files and a restricted
    quarantine area.
  why: Retains source evidence for replay, lineage and policy-based retention before Fabric processing.
  iac: tbd
  docs:
  - label: ADLS Gen2 introduction
    href: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
  - label: ADLS access control
    href: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-access-control
  architecture_notes:
  - Bronze and quarantine are logical containers or paths in this account, not separate Azure services.
  - Apply scoped Entra RBAC and, where needed, directory ACLs; configure retention, recovery and lifecycle policies.
  - Use storage firewall restrictions. The proposed Fabric shortcut route uses trusted workspace access and must be
    verified before network rules are finalized.
  home_node: bronze
  upstream:
  - pl-network
  - pl-entra
  - g-catalog
  downstream: []
  setup_steps:
  - title: Create the storage account
    detail: Choose an approved region and redundancy tier. Enable hierarchical namespace for ADLS Gen2 and enforce
      secure transport.
  - title: Create Bronze and quarantine areas
    detail: Create separate containers or directory scopes, agree partitioning, retention and lifecycle rules, and
      retain original receipt metadata.
  - title: Configure each access route
    detail: Use approved ADF managed private endpoints for ingestion. For Fabric, validate the trusted-workspace shortcut
      route separately; it is not automatically carried by customer VNet endpoints.
  - title: Test allowed and denied access
    detail: Copy a sample batch with the ingestion identity, read only approved Bronze with the analytics identity,
      and prove an ordinary report user cannot read raw files.
  access_controls:
  - principal: ADF managed identity
    role: Storage Blob Data Contributor
    scope: Bronze and approved quarantine scope
    note: Data-plane access is separate from Azure resource management roles.
  - principal: Fabric connection / workspace identity
    role: Storage Blob Data Reader
    scope: Approved Bronze scope
    note: Use a supported connector identity and trusted workspace configuration. Validate shortcut permissions end
      to end.
  - principal: Engineers / operators
    role: Scoped RBAC or POSIX ACL permissions
    scope: Required containers and paths
    note: RBAC data grants can authorize access without ACL evaluation; when using ACL-based access, include directory
      traversal. Avoid broad account-wide grants.
