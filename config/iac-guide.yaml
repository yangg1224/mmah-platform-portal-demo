considered_not_on_blueprint:
- name: Fabric Warehouse
  reason: Gold lakehouse and its SQL analytics endpoint cover the proposed batch analytics path. Add a warehouse only
    for a demonstrated SQL warehousing requirement.
- name: Real-Time Intelligence / Eventstream / Eventhouse
  reason: No streaming requirement was supplied. Add these after identifying a concrete real-time source, latency
    target and consumer.
- name: Fabric Data Science / machine learning / Copilot
  reason: The branch chart marks Machine Learning & AI as future state. Define the use case, responsible owner, approved
    data and policy controls before selecting these capabilities.
- name: Standalone MDM platform
  reason: Reference Delta tables and stewarded matching rules cover the proposed initial master-data scope. Revisit
    when entity mastering and stewardship requirements expand.
- name: Public data publishing or external sharing
  reason: No release channel or public-access requirement was provided. DPU must define approval and disclosure controls
    before a publishing service is added.
open_questions:
- id: oq1
  text: Confirm tenant, Azure subscription, approved region/data residency, enterprise platform owners and whether
    existing Fabric/Purview services can be reused.
- id: oq2
  text: Confirm source systems, intake channels, data-sharing agreements, sensitivity, retention and expected volumes;
    decide whether on-premises connectivity is required.
- id: oq3
  text: Approve the Fabric-to-ADLS network route. Validate trusted workspace access prerequisites; if policy requires
    disabled public network access, prove a supported private route for the shortcut workload before provisioning.
- id: oq4
  text: Confirm environment/workspace separation, production capacity isolation, budget owner and Power BI producer/consumer
    licensing.
- id: oq5
  text: Agree SDGU-G quality gates and reference-data ownership, DPU disclosure rules, BIRU KPI definitions and operational
    support responsibilities.
- id: oq6
  text: Choose the existing enterprise Git and delivery toolchain; confirm Purview scanning/lineage coverage, diagnostic
    collection and release approvals.
