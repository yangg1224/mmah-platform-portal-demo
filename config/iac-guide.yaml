    note: RBAC data grants can authorize access without ACL evaluation; when using ACL-based access, include directory
      traversal. Avoid broad account-wide grants.
- id: st-quarantine
  tag: STORE
  title: Quarantine
  subtitle: Restricted rejects · inspection and replay
  parent: st-adls
  resource_kind: logical-layer
  resource_type: ADLS Gen2 container / directory
  branch_boxes:
  - dqm
  - dqp
  - cls
  owning_unit: SDGU-E
  owner: 'Proposed: SDGU-E operates the reject path; SDGU-G owns quality thresholds and DPU resolves source issues.'
  phase: v1
  status: planned
  status_source: Proposed architecture; no deployment inventory or runtime evidence supplied.
  status_by_env:
    Dev: planned
    Test: planned
    Pre-Prod: planned
    Prod: planned
  summary: Restricted storage for rejected files or batches with failure reasons, remediation ownership and controlled
    retention.
  why: Separates invalid or unapproved data from data eligible for curation.
  iac: na
  docs:
  - label: ADLS access control
    href: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-access-control
  architecture_notes:
  - Quality rejection is a pipeline rule, not a built-in feature of a storage container.
  - Assess upload malware scanning for the chosen intake channel; do not treat quality validation as malware protection.
  home_node: bronze
  upstream:
  - i-adf
  - p-spark
  downstream: []
  setup_steps:
  - title: Isolate rejected intake
    detail: Create a restricted quarantine scope with reason codes and a reviewed replay process. Keep it outside
      the report consumer path.
  - title: Create Bronze and quarantine areas
    detail: Create separate containers or directory scopes, agree partitioning, retention and lifecycle rules, and
      retain original receipt metadata.
  - title: Configure each access route
    detail: Use approved ADF managed private endpoints for ingestion. For Fabric, validate the trusted-workspace shortcut
      route separately; it is not automatically carried by customer VNet endpoints.
  - title: Test allowed and denied access
    detail: Copy a sample batch with the ingestion identity, read only approved Bronze with the analytics identity,
      and prove an ordinary report user cannot read raw files.
  access_controls:
  - principal: Approved rejection writers
    role: Scoped storage write permissions
    scope: Quarantine container or paths
    note: Grant only the identity used by the rejection activity. A Bronze read identity does not automatically receive
      quarantine access.
  - principal: Authorized remediation operators
    role: Approved read / replay permissions
    scope: Restricted quarantine area
    note: Audit access and replay. Report audiences and general analysts receive no quarantine access.
